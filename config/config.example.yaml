workspace: /migrate
state_dir: /migrate/state
incoming_dir: /migrate/incoming
sync_dir: /migrate/sync
log_dir: /migrate/logs

hyperv:
  host: hyperv01
  transport: winrm
  checkpoint_consistency: application

proxmox:
  host: 10.20.99.37
  user: root
  identity_file: /home/ubuntu/.ssh/hv2pve_pve
  storage: ceph-vm
  efi_storage: ceph-vm
  test_vnet: REQUIRED_ISOLATED_VNET
  # Never set this equal to test_vnet. The correct production VNet is
  # migration-specific and must match the source VM's intended network.
  production_vnet: REQUIRED_SOURCE_PRODUCTION_VNET

transfer:
  method: rsync
  bandwidth_limit_mbps: null
  partial: true

validation:
  require_isolated_test: true
  require_last_sync: true
  require_guest_boot: true
  require_application: false

cutover:
  source_shutdown_timeout_seconds: 300
  rollback_window_minutes: 60
  require_exact_vm_name_confirmation: true

native_rct:
  enabled: false
  helper_path: C:\hv2pve\Hv2Pve.Rct.exe
  require_wmi_native_range_comparison: true
  require_explicit_frozen_disk_path: true
