# hv2pve controller example configuration.
# The current CLI accepts flags directly; this file documents the intended
# persistent settings for the next configuration-loader revision.
workspace: /migrate
state_dir: /migrate/state
incoming_dir: /migrate/incoming
sync_dir: /migrate/sync
log_dir: /migrate/logs

proxmox:
  host: 10.20.99.37
  user: root
  storage: ceph-vm
  identity_file: /home/ubuntu/.ssh/hv2pve_pve

network:
  # MUST be an isolated/non-production Proxmox bridge or SDN VNet.
  # Do not substitute vlan60 here unless vlan60 has deliberately been made
  # isolated, which it is not in the current lab design.
  test_vnet: REQUIRED_ISOLATED_VNET
  # Production network is migration-specific. Example only:
  production_vnet: vlan60

source:
  transport: scp
  hyperv_host: REQUIRED_HYPERV_HOST

safety:
  require_isolated_test: true
  require_verified_sync_before_cutover: true
  require_exact_vm_name_confirmation: true
  force_power_off_source: false
  delete_source_automatically: false
